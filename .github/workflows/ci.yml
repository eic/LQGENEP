name: CI

on:
  push:
    branches: [ main, master, copilot/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-32bit:
    name: Build and Test (32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build 32-bit Docker image
        run: |
          docker build --platform linux/386 --tag lqgenep:32bit .
      
      - name: Run 32-bit test
        run: |
          docker run --platform linux/386 --rm -v $PWD:/work -w /work lqgenep:32bit /LQGENEP/LQguser
          
      - name: Upload 32-bit output
        uses: actions/upload-artifact@v4
        with:
          name: output-32bit
          path: |
            LQGENEP_output.txt
            *.histo
          if-no-files-found: warn

  test-64bit:
    name: Build and Test (64-bit)
    runs-on: ubuntu-latest
    needs: test-32bit
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      
      - name: Build 64-bit binary (placeholder)
        run: |
          echo "64-bit build will be implemented after replacing CERNLIB dependencies"
          # gfortran -o LQguser LQguser.f lqgenep.f extrafiles/pythia6156.f
        continue-on-error: true
      
      - name: Run 64-bit test (placeholder)
        run: |
          echo "64-bit tests will be enabled after porting is complete"
        continue-on-error: true

  compare-outputs:
    name: Compare 32-bit and 64-bit outputs
    runs-on: ubuntu-latest
    needs: [test-32bit, test-64bit]
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - name: Download 32-bit output
        uses: actions/download-artifact@v4
        with:
          name: output-32bit
          path: output-32bit
        continue-on-error: true
      
      - name: Download 64-bit output
        uses: actions/download-artifact@v4
        with:
          name: output-64bit
          path: output-64bit
        continue-on-error: true
      
      - name: Compare outputs
        run: |
          echo "Output comparison will be implemented once 64-bit build is working"
          if [ -f output-32bit/LQGENEP_output.txt ]; then
            echo "32-bit output exists"
            head -20 output-32bit/LQGENEP_output.txt || true
          fi
        continue-on-error: true
